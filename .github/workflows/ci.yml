name: CI (Phase 1 — Data Collection & Measurement Verification Mode)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (report-only mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:report
        continue-on-error: true
      - run: npm run lint:gate
        continue-on-error: true
      - run: npm run lint:density
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            lint-report.json
            violation-density-report.json
          retention-days: 14

  vitest:
    name: Vitest Coverage (TypeScript Tool Column)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm run test:vitest:coverage
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: vitest-coverage/
          retention-days: 14

  duplication:
    name: Duplication (jscpd — report-only mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      # Phase 1 Data Mode: report-only — continue-on-error enabled so build passes cleanly
      # while jscpd measures and records duplication data to jscpd-report.json.
      - run: npm run dup
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jscpd-report
          path: jscpd-report/
          retention-days: 14
      # Regression Focus Mapping: maps clone pairs to unit test files
      - run: node scripts/duplication-regression.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duplication-regression-map
          path: duplication-regression-map.json
          retention-days: 14

  test:
    name: Test + Coverage (data collection mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      # Phase 1 Data Mode: test & coverage data collection
      - run: npm run test:coverage:gate
        continue-on-error: true
      # Informational coverage delta comparison vs baseline
      - run: npm run coverage:delta
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-mocha-coverage
          path: nyc-mocha/
          retention-days: 14
      # Emit mocha-stats.json sidecar (Granularity, Correctness, Boundary Failure Rate)
      - run: node scripts/mocha-stats.mjs
        continue-on-error: true
      - run: node scripts/verify-audit-log.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mocha-stats
          path: |
            mocha-stats.json
            audit-trail-report.json
          retention-days: 14
      # Fresh Logic Proofing (patch coverage check)
      - name: Fresh logic proofing (patch coverage — informational)
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          if command -v diff-cover &>/dev/null; then
            diff-cover nyc-mocha/lcov.info --compare-branch=origin/main \
              --fail-under=0 --quiet || true
          else
            echo "diff-cover not available; skipping patch coverage check."
          fi
        continue-on-error: true

  code-churn:
    name: Code churn + test impact map (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm run churn
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: churn-report
          path: |
            churn-report.json
            test-impact-map.json
          retention-days: 14

  build:
    name: Build (Webpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  audit:
    name: Security SAST & SCA audit (all 15 metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      - run: npm audit --production --audit-level=high
        continue-on-error: true
      - run: node scripts/generate-sbom.mjs
        continue-on-error: true
      - run: node scripts/license-check.mjs
        continue-on-error: true
      - run: node scripts/dependency-health.mjs
        continue-on-error: true
      - run: node scripts/secret-scan.mjs
        continue-on-error: true
      - run: npm run scan:osv-grype
        continue-on-error: true
      - run: npm run ncu:check
        continue-on-error: true
      - run: npm run advisories:poll
        continue-on-error: true
      - run: node scripts/sast-sca-master-report.mjs
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-sca-security-reports
          path: |
            cyclonedx-sbom.json
            license-compliance-report.json
            dependency-health-report.json
            secret-scan-report.json
            osv-grype-report.json
            ncu-report.json
            advisories-report.json
            sast-sca-master-report.json
          retention-days: 14

